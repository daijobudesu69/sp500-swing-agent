name: Daily Swing Signal — Morning Jakarta
on:
  schedule:
    - cron: '0 1 * * 2-6'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass the Batch 4 start guard (pre-launch verification only)'
        type: boolean
        default: false
      verification:
        description: 'Stamp every shadow row VETOED — excluded from equity and Batch 4 stats'
        type: boolean
        default: true
jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Batch 4 start guard
        id: startgate
        run: |
          # PHASE 2.6 / BATCH 4 (Aug 2026)
          # ------------------------------------------------------------------
          # The Batch 3 CUTOFF guard (blocked everything on/after
          # 2026-07-26T05:00:00Z) has been REMOVED. It is replaced by a START
          # guard so the pipeline stays dormant — zero API calls, zero cost —
          # until Batch 4 formally begins.
          #
          # Batch 4 start: first run Tue 2026-08-11 01:00 UTC (08:00 WIB),
          # which analyses the Mon 2026-08-10 US close. Note 2026-08-10 is a
          # Monday and this cron only fires Tue-Sat, so Monday itself has no
          # scheduled run — Tuesday morning WIB is the first one that covers it.
          #
          # NO END CUTOFF. Per decision #5, Batch 4 runs open-endedly. If a
          # freeze is needed later, re-add a CUTOFF_EPOCH block here rather
          # than editing this one.
          #
          # PHASE 2.6.1 — the pre-launch check no longer requires editing
          # START_EPOCH. Use Run workflow -> force_run = true instead.
          # Editing a date constant means committing it twice and REMEMBERING
          # to revert; if the revert is forgotten the guard is silently dead
          # forever, with no symptom until an unwanted run costs money. A
          # dispatch input cannot be left switched on — it defaults back to
          # false the moment the run ends. Same class of fix as stamping
          # verification rows at write time rather than cleaning up after.
          START_EPOCH=$(date -u -d "2026-08-11T00:00:00Z" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "🔓 force_run=true — start guard bypassed (manual dispatch)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$NOW_EPOCH" -lt "$START_EPOCH" ]; then
            echo "⏸️  Before Batch 4 start (2026-08-11 00:00 UTC). Skipping — no API calls."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Batch 4 active. Proceeding with pipeline."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against an untagged pre-launch run
        if: steps.startgate.outputs.should_run == 'true' && inputs.force_run == true && inputs.verification != true
        run: |
          # force_run bypasses the date guard, so this run writes rows that
          # look exactly like Batch 4 rows but sit outside the batch window.
          # Allowing that untagged is how a batch quietly acquires trades it
          # never made. If a genuinely tradable early run is ever wanted,
          # remove this step deliberately — do not switch verification off
          # by habit.
          echo "::error::force_run=true with verification=false would write UNTAGGED"
          echo "::error::rows outside the Batch 4 window. Re-run with verification=true."
          exit 1

      - name: Checkout repository
        if: steps.startgate.outputs.should_run == 'true'
        uses: actions/checkout@v6
      - name: Setup Python 3.11
        if: steps.startgate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: steps.startgate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily signal pipeline
        if: steps.startgate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_TAB: ${{ secrets.GSHEET_TAB }}
          VERIFICATION_RUN: ${{ inputs.verification }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m src.main --mode daily
      - name: Commit equity cache if changed
        if: steps.startgate.outputs.should_run == 'true' && inputs.verification != true
        continue-on-error: true
        run: |
          # Phase 2.6: main.py writes .last_equity after a successful Sheets
          # equity read. Persisting it back to the repo is what makes the
          # fallback cache survive between runs (each run is a fresh checkout).
          # continue-on-error: a failed commit must never fail the pipeline —
          # signals were already sent by this point.
          if [ -n "$(git status --porcelain .last_equity)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_equity
            git commit -m "chore: update equity cache [skip ci]"
            git push
          else
            echo "No equity cache change to commit."
          fi
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 7
          if-no-files-found: ignore
