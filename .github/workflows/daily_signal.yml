name: Daily Swing Signal — 7PM Jakarta

on:
  schedule:
    # 7 PM Jakarta = 12:00 UTC, weekdays (Mon-Fri)
    # GitHub Actions cron has ±5 min jitter — that's fine for our use case
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # generous buffer; pipeline usually 6-9 min
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run daily signal pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m src.main --mode daily
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 7
          if-no-files-found: ignore
