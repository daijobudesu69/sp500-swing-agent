name: Daily Swing Signal — Morning Jakarta
on:
  schedule:
    - cron: '0 1 * * 2-6'
  workflow_dispatch:
jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Batch 3 cutoff guard
        id: cutoff
        run: |
          # Batch 3 freeze — no new signal generation on/after this instant.
          # Sunday 2026-07-26 01:00 US Eastern (EDT, UTC-4) = 2026-07-26 05:00 UTC.
          # Last allowed run: Sat 2026-07-25 01:00 UTC (08:00 WIB), based on
          # Friday 2026-07-24 US close. Everything from Tue 2026-07-28 onward
          # (and every week after) is auto-skipped — zero API calls, zero cost.
          CUTOFF_EPOCH=$(date -u -d "2026-07-26T05:00:00Z" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "🛑 Batch 3 cutoff reached (2026-07-26 05:00 UTC). Skipping pipeline — no API calls."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Before cutoff. Proceeding with pipeline."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.cutoff.outputs.should_run == 'true'
        uses: actions/checkout@v6
      - name: Setup Python 3.11
        if: steps.cutoff.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: steps.cutoff.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily signal pipeline
        if: steps.cutoff.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_TAB: ${{ secrets.GSHEET_TAB }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m src.main --mode daily
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 7
          if-no-files-found: ignore
